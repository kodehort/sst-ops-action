name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
    # Dependency-only PRs (Renovate bumps) aren't worth a review. A PR that
    # touches these AND anything else still runs.
    paths-ignore:
      - "package.json"
      - "package-lock.json"
      - "bun.lock"

jobs:
  claude-review:
    # Bots are reviewed like anyone else; only explicit title opt-outs skip.
    if: |
      !contains(github.event.pull_request.title, '[skip-review]') &&
      !contains(github.event.pull_request.title, '[WIP]')

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Please review this pull request and provide feedback on:
            - Code quality and best practices
            - Potential bugs or issues
            - Performance considerations
            - Security concerns
            - Test coverage

            Be constructive and helpful in your feedback.

          # Reuse one comment across pushes instead of stacking new ones.
          use_sticky_comment: true

          # v1 passes model and tool grants through the CLI rather than inputs.
          # The action's own default model (claude-sonnet-4) is retired, so pin it.
          claude_args: |
            --model claude-opus-5
            --allowedTools "Bash(bun run test),Bash(bun run lint),Bash(bun run typecheck)"
