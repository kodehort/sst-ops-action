name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  BUN_VERSION: '1.4.0'

jobs:
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ steps.cache.outputs.cache-hit }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so the fallow audit can resolve its base ref
          fetch-depth: 0

      - name: Setup Environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          bun-version: ${{ env.BUN_VERSION }}
          cache-key-suffix: -quality

      - name: Type Check
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      # Runs before the coverage step on purpose: a coverage/ directory present
      # in the working tree but absent from fallow's base snapshot makes
      # pre-existing CRAP findings register as newly introduced, failing the
      # gate spuriously. Exits 1 only on a `fail` verdict (gate: new-only, so
      # only findings this changeset introduces count).
      - name: Dead Code Audit
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            bun fallow audit --base "origin/$BASE_REF"
          else
            bun fallow audit
          fi

      - name: Test with Coverage
        run: bun run test:coverage
        
      - name: Upload Coverage Reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-${{ github.sha }}
          path: coverage/
          retention-days: 30

  build-and-verify:
    name: Build & Verify
    runs-on: ubuntu-latest
    needs: quality-gates
    outputs:
      bundle-size: ${{ steps.bundle-info.outputs.size }}
      bundle-hash: ${{ steps.bundle-info.outputs.hash }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        
      - name: Setup Environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          bun-version: ${{ env.BUN_VERSION }}
          cache-key-suffix: -build
          # The drift check below compares bytes, so node_modules must come
          # from bun.lock alone and never from a restore-keys prefix hit.
          cache-node-modules: 'false'

      - name: Build Distribution
        run: bun run build

      - name: Test Built Action
        id: bundle-smoke
        uses: ./
        with:
          operation: stage
          token: fake-token

      - name: Verify Built Action Outputs
        env:
          COMPUTED_STAGE: ${{ steps.bundle-smoke.outputs.computed_stage }}
          OPERATION: ${{ steps.bundle-smoke.outputs.operation }}
          SUCCESS: ${{ steps.bundle-smoke.outputs.success }}
        run: |
          test "$SUCCESS" = "true"
          test "$OPERATION" = "stage"
          test -n "$COMPUTED_STAGE"

      # The action runs from the committed dist/, so a rebuild has to reproduce
      # it byte for byte. Without this, a PR that forgets to rebuild goes green
      # and ships stale code.
      #
      # build-manifest.json is excluded on purpose: it records the build
      # timestamp, platform, arch and Node version, so it can never match.
      - name: Verify Committed Bundle Is In Sync
        run: |
          if ! git diff --exit-code --quiet -- dist/index.js dist/index.js.map; then
            echo "dist/index.js committed: $(git show HEAD:dist/index.js | sha256sum | cut -d' ' -f1)"
            echo "dist/index.js rebuilt:   $(sha256sum dist/index.js | cut -d' ' -f1)"
            echo ""
            echo "Release commits are tagged [skip ci], so a stale bundle"
            echo "committed by a release first surfaces here, on the next PR."
            echo "::error::Committed bundle is stale. Run 'bun run build' and commit dist/."
            exit 1
          fi
          echo "✅ Committed bundle matches a fresh build"


      - name: Extract Bundle Information
        id: bundle-info
        run: |
          # Check bundle exists
          if [ ! -f "dist/index.js" ]; then
            echo "❌ Bundle file dist/index.js not found"
            exit 1
          fi
          
          # Get bundle size and hash
          BUNDLE_SIZE=$(stat -f%z dist/index.js 2>/dev/null || stat -c%s dist/index.js)
          BUNDLE_SIZE_MB=$(awk -v bytes="$BUNDLE_SIZE" 'BEGIN { printf "%.2f", bytes / 1024 / 1024 }')
          BUNDLE_SIZE_LIMIT_BYTES=$((10 * 1024 * 1024))
          BUNDLE_HASH=$(sha256sum dist/index.js | cut -d' ' -f1)
          
          echo "size=${BUNDLE_SIZE_MB}MB" >> $GITHUB_OUTPUT
          echo "hash=${BUNDLE_HASH}" >> $GITHUB_OUTPUT
          
          echo "📦 Bundle size: ${BUNDLE_SIZE_MB}MB"
          echo "🔒 Bundle hash: ${BUNDLE_HASH:0:16}..."
          
          # Verify bundle size limit
          if [ "$BUNDLE_SIZE" -gt "$BUNDLE_SIZE_LIMIT_BYTES" ]; then
            echo "❌ Bundle size exceeds 10MB limit!"
            exit 1
          fi
          
      - name: Test Bundle Execution
        run: |
          echo "🧪 Testing bundle execution..."
          timeout 30s node -c dist/index.js
          echo "✅ Bundle syntax validation passed"
          
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 30

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [quality-gates, build-and-verify]
    if: always()
    
    steps:
      - name: Generate Summary
        run: |
          echo "## 🚀 CI Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Quality Gates Status
          if [ "${{ needs.quality-gates.result }}" = "success" ]; then
            echo "✅ **Quality Gates**: All checks passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Quality Gates**: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Build Status
          if [ "${{ needs.build-and-verify.result }}" = "success" ]; then
            echo "✅ **Build & Verify**: Bundle created successfully" >> $GITHUB_STEP_SUMMARY
            echo "   - Size: ${{ needs.build-and-verify.outputs.bundle-size }}" >> $GITHUB_STEP_SUMMARY
            echo "   - Hash: \`${{ needs.build-and-verify.outputs.bundle-hash }}\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Build & Verify**: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          # The committed dist/ is what the action runs, so Build & Verify
          # checks a fresh build reproduces it byte for byte.
          if [ "${{ needs.build-and-verify.result }}" = "success" ]; then
            echo "📦 **Distribution**: Committed bundle matches a fresh build" >> $GITHUB_STEP_SUMMARY
          else
            echo "📦 **Distribution**: Not verified — see Build & Verify" >> $GITHUB_STEP_SUMMARY
          fi
          
      - name: Set Status
        run: |
          if [ "${{ needs.quality-gates.result }}" != "success" ] || [ "${{ needs.build-and-verify.result }}" != "success" ]; then
            echo "❌ CI pipeline failed"
            exit 1
          else
            echo "✅ CI pipeline completed successfully"
          fi
